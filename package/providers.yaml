# X (Twitter) OAuth endpoint configuration for x-oauth-app.
#
# Credentials (clientId / clientSecret) are NOT stored here — they are supplied as
# the X_CLIENT_ID / X_CLIENT_SECRET machine environment variables. This file holds
# only the non-secret OAuth endpoints + settings, passed to aux4/oauth via
# --configFile.
#
# Notes for X:
# - Use x.com / api.x.com (NOT twitter.com, which redirects and lowercases the
#   query string, breaking client_id / code_challenge).
# - Scopes are SPACE-separated. users.read is required for the /2/users/me profile
#   lookup done during the code exchange; offline.access is required to receive a
#   refresh token.
# - clientSecretIn: basic — X confidential (Web App) clients authenticate at the
#   token endpoint with HTTP Basic auth (client_secret_basic). A public (Native
#   App) client has no secret, so this is simply ignored (PKCE only).
config:
  x:
    authUrl: https://x.com/i/oauth2/authorize
    tokenUrl: https://api.x.com/2/oauth2/token
    userinfoUrl: https://api.x.com/2/users/me
    scopes: tweet.read users.read offline.access
    clientSecretIn: basic
