# aux4/api routes contributed by the X plugin.
#
# This plugin depends on the aux4/oauth-app core (which owns /health and the
# oauth-app profile) and adds the X provider routes. When several provider plugins
# are deployed to one machine, the cloud merges every package's config.api.
config:
  api:
    # Gated by default (secure mode): requires a same-scope aux4 idToken.
    "GET /x/authorize-url":
      command: aux4 oauth-app x authorize-url
    # Redirect landing point for X. Register <machine-url>/api/x/callback as the
    # redirect URI on the X app. Delegates to the shared core handler, which parks
    # the code by session id for the polling CLI. PUBLIC: the provider's browser
    # redirect carries no aux4 token, and the parked code is useless without the
    # client's PKCE verifier.
    "GET /x/callback":
      command: aux4 oauth-app callback
      public: true
    # Gated by default (secure mode): requires a same-scope aux4 idToken.
    "POST /x/exchange":
      command: aux4 oauth-app x exchange
    # PUBLIC: the refresh token is itself the credential, so refresh stays open —
    # but rate-limited to blunt brute-force / abuse.
    "POST /x/refresh":
      command: aux4 oauth-app x refresh
      public: true
      rateLimit:
        max: 10
        timeWindow: 60000
