# aux4/api routes contributed by the X plugin.
#
# This plugin depends on the aux4/oauth-app core (which owns /health and the
# oauth-app profile) and adds the X provider routes. When several provider plugins
# are deployed to one machine, the cloud merges every package's config.api.
config:
  api:
    "GET /x/authorize-url":
      command: aux4 oauth-app x authorize-url
    "POST /x/exchange":
      command: aux4 oauth-app x exchange
    "POST /x/refresh":
      command: aux4 oauth-app x refresh
